name: Windows CI & Compatibility Matrix

on:
  push:
    branches: [ main, dev, 'dev/**', 'chore/**', 'audit/**' ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.contracts_target }})
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        contracts_target: [ 'pinned-stable', 'upstream-main' ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Verify Documentation Synchronization & Links
        if: matrix.contracts_target == 'pinned-stable'
        shell: pwsh
        run: |
          .\tools\scripts\check-doc-sync.ps1
          .\tools\scripts\check-doc-links.ps1
          .\tools\scripts\test-doc-checkers.ps1

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v4

      - name: Setup VSTest
        uses: darenm/Setup-VSTest@v1.3

      - name: Determine Upstream Contracts Reference
        id: contracts-ref
        shell: pwsh
        run: |
          if ("${{ matrix.contracts_target }}" -eq "pinned-stable") {
            $ref = (Get-Content OPTIKEY_CONTRACT_REF | Where-Object { $_ -match "^PINNED_COMMIT=(.+)$" } | ForEach-Object { $matches[1].Trim() })
            if (-not $ref) { $ref = "v4.2.2" }
          } else {
            $ref = "main"
          }
          Write-Host "Resolved Target Ref: $ref"
          echo "target_ref=$ref" >> $env:GITHUB_OUTPUT

      - name: Build Upstream OptiKey Contracts
        shell: pwsh
        run: |
          .\tools\scripts\build-contracts.ps1 -TargetRef "${{ steps.contracts-ref.outputs.target_ref }}"

      - name: Restore NuGet packages
        shell: pwsh
        run: |
          msbuild OptiKey-ET5-Plugin.sln /p:Configuration=Release /p:Platform=x64 /t:Restore /v:m

      - name: Build Solution (x64 Release)
        shell: pwsh
        run: |
          msbuild OptiKey-ET5-Plugin.sln /p:Configuration=Release /p:Platform=x64 /t:Rebuild /v:m

      - name: Run Unit & Integration Tests
        shell: pwsh
        run: |
          .\tools\scripts\run-tests.ps1
      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: OptiKey-ET5-Plugin-TestResults-${{ matrix.contracts_target }}
          path: |
            artifacts/test-results/OptiKey.ET5.Plugin.Tests.trx
            artifacts/test-results/vstest-output.log

      - name: Package Release ZIP & Audit Integrity
        if: matrix.contracts_target == 'pinned-stable'
        shell: pwsh
        run: |
          .\tools\scripts\package-release.ps1 -Version "0.0.0-ci.${{ github.run_number }}"

      - name: Packaged OptiKey Loader Smoke Test
        if: matrix.contracts_target == 'pinned-stable'
        shell: pwsh
        run: |
          $zip = (Get-ChildItem -Path artifacts/release -Filter "OptiKey-ET5-Plugin-*.zip" | Select-Object -First 1).FullName
          $contracts = (Resolve-Path "lib/contracts/JuliusSweetland.OptiKey.Contracts.dll").Path
          $harness = (Resolve-Path "tools/PackagedLoaderHarness/bin/x64/Release/net46/PackagedLoaderHarness.exe").Path
          & $harness $zip $contracts (Resolve-Path "tests/OptiKey.ET5.Plugin.Tests/bin/x64/Release/net46").Path

      - name: Upload Release Artifacts
        if: always() && matrix.contracts_target == 'pinned-stable'
        uses: actions/upload-artifact@v7
        with:
          name: OptiKey-ET5-Plugin-Package
          path: |
            artifacts/release/OptiKey-ET5-Plugin-*.zip
            artifacts/release/SHA256SUMS.txt
